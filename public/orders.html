<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sipariş Listesi</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h2>📋 Sipariş Listesi</h2>
            <a href="/" class="btn-secondary">🏠 Ana Menü</a>
        </div>

        <div class="card">
            <div class="filter-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Müşteri, Telefon veya Ürün Ara..." onkeyup="filterOrders()">
                </div>
                <div class="status-box">
                    <select id="statusFilter" onchange="filterOrders()">
                        <option value="Tümü">Tüm Durumlar</option>
                        <option value="Bekliyor">Bekliyor</option>
                        <option value="Hazırlanıyor">Hazırlanıyor</option>
                        <option value="Teslim Edildi">Teslim Edildi</option>
                        <option value="Sipariş Tamamlandı">Sipariş Tamamlandı</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th class="sortable" onclick="toggleSort('musteri')">Müşteri <span id="icon-musteri"></span></th>
                            <th>Detay</th>
                            <th class="sortable" onclick="toggleSort('tarih')">Tarih / Teslim <span id="icon-tarih"></span></th>
                            <th class="sortable" onclick="toggleSort('fiyat')">Fiyat <span id="icon-fiyat"></span></th>
                            <th>Durum</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="siparisTablosu">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ Siparişi Düzenle</h3>
                <span class="close-btn" onclick="closeEditModal()">&times;</span>
            </div>
            
            <div class="modal-body">
                <form id="editForm" onsubmit="updateSiparis(event)">
                    <input type="hidden" id="editId">
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label>Ad Soyad</label>
                            <input type="text" id="editMusteri" placeholder="Ad Soyad" required>
                        </div>
                        <div class="form-group half">
                            <label>Telefon</label>
                            <input type="text" id="editTelefon" placeholder="Telefon" required>
                        </div>
                    </div>

                    <div class="product-section">
                        <label class="section-title">📦 Sipariş Ürünleri</label>
                        <div id="editUrunListesiContainer" class="urun-container"></div>
                        
                        <div class="product-actions">
                            <button type="button" class="btn-add-row" onclick="satirEkle('edit')">+ Satır Ekle</button>
                            <div class="price-display">
                                Toplam: <span id="editToplamFiyatGoster">0</span> TL
                                <input type="hidden" id="editFiyat">
                            </div>
                        </div>
                    </div>

                    <div class="image-section">
                        <label class="section-title">📷 Görseller</label>
                        <div id="editMevcutGorseller" class="gallery-grid"></div>
                        <input type="file" id="editYeniGorseller" multiple accept="image/jpeg,image/png,image/webp,image/gif" class="file-input">
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label>Durum</label>
                            <select id="editDurum">
                                <option value="Bekliyor">Bekliyor</option>
                                <option value="Hazırlanıyor">Hazırlanıyor</option>
                                <option value="Teslim Edildi">Teslim Edildi</option>
                                <option value="Sipariş Tamamlandı">Sipariş Tamamlandı</option>
                            </select>
                        </div>
                        <div class="form-group half">
                            <label>Teslim Tarihi</label>
                            <input type="date" id="editTarih" required>
                        </div>
                    </div>

                    <div class="payment-section">
                        <label>Ödeme Durumu</label>
                        <div class="payment-row">
                            <input type="number" id="editOdenen" placeholder="Alınan Tutar (TL)">
                            <label class="checkbox-label">
                                <input type="checkbox" id="editTamamiOdendi"> Tamamı Alındı
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Notlar</label>
                        <textarea id="editNot" rows="3" placeholder="Sipariş notları..."></textarea>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeEditModal()">İptal</button>
                <button type="button" class="btn-save" onclick="document.getElementById('editForm').dispatchEvent(new Event('submit'))">💾 Kaydet</button>
            </div>
        </div>
    </div>
    
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📄 Sipariş Özeti</h3>
                <span class="close-btn" onclick="closeDetailModal()">&times;</span>
            </div>
            <div id="detailContent" class="modal-body"></div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeDetailModal()">Kapat</button>
            </div>
        </div>
    </div>

    <div id="imageModal" class="modal full-screen" onclick="closeImageModal()">
        <span class="close-btn-fullscreen">&times;</span>
        <img id="imgViewer">
    </div>

    <script src="script.js"></script>
</body>
</html>
