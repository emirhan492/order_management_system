<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sipariş Listesi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>📋 Sipariş Listesi</h2>
            <a href="/" class="btn-geri">🏠 Ana Menü</a>
        </div>

        <div class="card">
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee;">
                <div style="flex: 3; min-width: 200px;">
                    <input type="text" id="searchInput" placeholder="🔍 Müşteri Adı veya Telefon Ara..." onkeyup="filterOrders()">
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <select id="statusFilter" onchange="filterOrders()">
                        <option value="Tümü">Tüm Durumlar</option>
                        <option value="Bekliyor">Bekliyor</option>
                        <option value="Hazırlanıyor">Hazırlanıyor</option>
                        <option value="Teslim Edildi">Teslim Edildi</option>
                        <option value="Sipariş Tamamlandı">Sipariş Tamamlandı</option>
                    </select>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th class="sortable" onclick="toggleSort('musteri')">Müşteri <span id="icon-musteri"></span></th>
                            <th>Detay</th>
                            <th class="sortable" onclick="toggleSort('tarih')">Tarih / Teslim <span id="icon-tarih"></span></th>
                            <th class="sortable" onclick="toggleSort('fiyat')">Fiyat <span id="icon-fiyat"></span></th>
                            <th>Durum</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="siparisTablosu"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ Siparişi Düzenle</h3>
                <span class="close-btn" onclick="closeEditModal()">&times;</span>
            </div>
            
            <div class="modal-body">
                <form id="editForm" onsubmit="updateSiparis(event)">
                    <input type="hidden" id="editId">
                    
                    <div class="form-group">
                        <label>Müşteri Bilgileri</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="editMusteri" placeholder="Ad Soyad" required>
                            <input type="text" id="editTelefon" placeholder="Telefon" required>
                        </div>
                    </div>

                    <div class="form-group" style="background: #f9f9f9; padding: 15px; border-radius: 6px; border:1px solid #eee;">
                        <label style="color:#2c3e50; margin-bottom:10px;">📦 Sipariş Ürünleri</label>
                        
                        <div id="editUrunListesiContainer" class="urun-listesi-kapsayici"></div>
                        
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; gap: 10px; flex-wrap: wrap;">
                            <button type="button" class="btn-urun-ekle" onclick="satirEkle('edit')" style="flex: 1; min-width: 150px; background:#3498db; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold;">
                                + Yeni Ürün Satırı Ekle
                            </button>
                            
                            <div style="font-weight: bold; color:#27ae60; font-size: 1.1em;">
                                Toplam: <span id="editToplamFiyatGoster">0</span> TL
                                <input type="hidden" id="editFiyat">
                            </div>
                        </div>
                    </div>

                    <div class="form-group" style="background: #fff8e1; padding: 15px; border-radius: 6px; border:1px solid #ffe0b2;">
                        <label style="color:#e67e22;">📷 Görseller</label>
                        <div id="editMevcutGorseller" class="gallery-grid"></div>
                        <input type="file" id="editYeniGorseller" multiple accept="image/*" style="margin-top:10px; font-size:12px;">
                    </div>

                    <div class="form-group">
                        <label>Durum</label>
                        <select id="editDurum">
                            <option value="Bekliyor">Bekliyor</option>
                            <option value="Hazırlanıyor">Hazırlanıyor</option>
                            <option value="Teslim Edildi">Teslim Edildi</option>
                            <option value="Sipariş Tamamlandı">Sipariş Tamamlandı</option>
                        </select>
                    </div>

                    <div class="form-group" style="background: #eefcf3; padding: 10px; border-radius: 6px;">
                        <label>Ödeme</label>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <input type="number" id="editOdenen" placeholder="Alınan Tutar (TL)">
                            <label style="display: flex; align-items: center; gap: 5px; font-weight:normal; margin:0; cursor:pointer;">
                                <input type="checkbox" id="editTamamiOdendi" style="width:auto;"> Tamamı
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Teslim Tarihi</label>
                        <input type="date" id="editTarih" required>
                    </div>

                    <div class="form-group">
                        <label>Notlar</label>
                        <textarea id="editNot" rows="3" placeholder="Genel notlar..."></textarea>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" onclick="closeEditModal()" style="background:#95a5a6; color:white; border:none; padding:10px 20px; border-radius:4px; margin-right:10px;">İptal</button>
                <button type="button" onclick="document.getElementById('editForm').dispatchEvent(new Event('submit'))" style="background:#2980b9; color:white; border:none; padding:10px 20px; border-radius:4px;">💾 Değişiklikleri Kaydet</button>
            </div>
        </div>
    </div>
    
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📄 Sipariş Detayı</h3>
                <span class="close-btn" onclick="closeDetailModal()">&times;</span>
            </div>
            
            <div id="detailContent" class="modal-body"></div>

            <div class="modal-footer">
                <button onclick="closeDetailModal()" style="background:#95a5a6; color:white; border:none; padding:8px 20px; border-radius:4px;">Kapat</button>
            </div>
        </div>
    </div>

    <div id="imageModal" class="modal" onclick="closeImageModal()">
        <span class="close-btn" style="position:absolute; top:20px; right:30px; color:white; font-size:40px; z-index:2100;">&times;</span>
        <div class="modal-content" style="background:transparent; box-shadow:none; border:none; align-items: center; justify-content: center;">
            <img id="imgViewer" style="max-width:90vw; max-height:90vh; border-radius:5px; object-fit: contain;">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
