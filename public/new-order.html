<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Yeni Sipariş</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>➕ Yeni Sipariş Oluştur</h2>
            <a href="orders.html" class="btn-geri">📋 Listeye Dön</a>
        </div>

        <div class="card">
            <form id="siparisForm">
                
                <h4 style="border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:20px; color:#3498db;">👤 Müşteri Bilgileri</h4>
                <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <div style="flex:1;">
                        <label>Ad Soyad</label>
                        <input type="text" id="musteri_adi" placeholder="Müşteri Adı" required>
                    </div>
                    <div style="flex:1;">
                        <label>Telefon</label>
                        <input type="text" id="telefon" placeholder="05..." required>
                    </div>
                </div>

                <h4 style="border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:20px; color:#3498db;">📦 Sipariş İçeriği</h4>
                
                <div id="urunListesiContainer" class="urun-listesi-kapsayici">
                    </div>

                <button type="button" onclick="satirEkle()" style="background-color: #ecf0f1; color: #2c3e50; border: 2px dashed #bdc3c7; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top:15px;">
                    + Yeni Ürün Satırı Ekle
                </button>

                <div style="background:#f8f9fa; padding:15px; margin-top:20px; text-align:right; border-radius:6px;">
                    <span style="color:#7f8c8d; font-size:14px;">GENEL TOPLAM:</span>
                    <strong style="font-size:24px; color:#27ae60; margin-left:10px;" id="toplamFiyatGoster">0 TL</strong>
                    <input type="hidden" id="fiyat" value="0">
                </div>

                <h4 style="border-bottom:1px solid #eee; padding-bottom:10px; margin:30px 0 20px 0; color:#3498db;">📅 Detaylar</h4>
                
                <div class="form-group">
                    <label>Teslim Tarihi</label>
                    <input type="date" id="teslim_tarihi" required>
                </div>

                <div class="form-group">
                    <label>Sipariş Fotoğrafları</label>
                    <input type="file" id="siparis_gorselleri" multiple accept="image/*" style="background:white;">
                </div>

                <div class="form-group">
                    <label>Genel Not</label>
                    <textarea id="siparis_notu" placeholder="Siparişle ilgili notlar..." rows="3"></textarea>
                </div>

                <button type="submit" class="btn-kaydet">✅ Siparişi Oluştur</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
