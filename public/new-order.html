<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Yeni Sipariş</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h2>➕ Yeni Sipariş Oluştur</h2>
            <a href="/" class="btn-secondary">🏠 Ana Menü</a>
        </div>

        <div class="card">
            <div class="modal-body"> <form id="siparisForm">
                    
                    <label class="section-title">👤 Müşteri Bilgileri</label>
                    <div class="form-row">
                        <div class="form-group half">
                            <label>Ad Soyad</label>
                            <input type="text" id="musteri_adi" placeholder="Müşteri Adı" required>
                        </div>
                        <div class="form-group half">
                            <label>Telefon</label>
                            <input type="text" id="telefon" placeholder="05..." required>
                        </div>
                    </div>

                    <div class="product-section">
                        <label class="section-title" style="border:none; padding:0; margin-bottom:15px;">📦 Sipariş İçeriği</label>
                        
                        <div id="urunListesiContainer" class="urun-container"></div>

                        <div class="product-actions">
                            <button type="button" class="btn-add-row" onclick="satirEkle()">
                                + Yeni Ürün Satırı Ekle
                            </button>
                            
                            <div class="price-display">
                                Toplam: <span id="toplamFiyatGoster">0</span> TL
                                <input type="hidden" id="fiyat" value="0">
                            </div>
                        </div>
                    </div>

                    <label class="section-title">📅 Detaylar ve Görseller</label>
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label>Teslim Tarihi</label>
                            <input type="date" id="teslim_tarihi" required>
                        </div>
                        <div class="form-group half">
                            <label>Sipariş Fotoğrafları</label>
                            <div style="background: #fffbeb; border: 1px solid #fef3c7; padding: 8px; border-radius: 6px;">
                                <input type="file" id="siparis_gorselleri" multiple accept="image/*" class="file-input">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Genel Not</label>
                        <textarea id="siparis_notu" placeholder="Siparişle ilgili özel notlar..." rows="3"></textarea>
                    </div>

                    <div style="margin-top: 20px;">
                        <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 1.1rem;">
                            ✅ Siparişi Oluştur
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
