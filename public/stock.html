<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stok Takip</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h2>📦 Stok Listesi</h2>
            <a href="/" class="btn-secondary">🏠 Ana Menü</a>
        </div>

        <div class="card">
            <div class="filter-bar">
                <div class="search-box">
                    <input type="text" id="searchStock" placeholder="🔍 Ürün Kodu veya İsmi Ara..." onkeyup="filterStocks()">
                </div>
                <div class="status-box" style="flex: 0 0 auto;">
                    <button onclick="openStockModal()" class="btn-save" style="width: 100%;">
                        + Ürün Ekle
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">Görsel</th>
                            <th>Ürün Kodu</th>
                            <th>Ürün İsmi</th>
                            <th>Miktar</th>
                            <th>Alış Fiyatı</th>
                            <th>Alış Tarihi</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="stokTablosu">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="stockModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📦 Yeni Ürün Ekle</h3>
                <span class="close-btn" onclick="closeStockModal()">&times;</span>
            </div>
            
            <div class="modal-body">
                <form id="stockForm">
                    <div class="form-group">
                        <label>Ürün Kodu</label>
                        <input type="text" id="urun_kodu" required placeholder="Örn: STK-001">
                    </div>
                    <div class="form-group">
                        <label>Ürün İsmi</label>
                        <input type="text" id="urun_ismi" required placeholder="Örn: Zebra Perde Kumaşı">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label>Kaç Top?</label>
                            <input type="number" id="top_sayisi" placeholder="0">
                        </div>
                        <div class="form-group half">
                            <label>Kaç Metre?</label>
                            <input type="number" id="metre" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                    
                    <div class="payment-section">
                        <label class="section-title">Maliyet Bilgileri</label>
                        <div class="form-row">
                            <div class="form-group half">
                                <label>Alış Fiyatı (TL)</label>
                                <input type="number" id="alis_fiyati" step="0.01">
                            </div>
                            <div class="form-group half">
                                <label>Alış Tarihi</label>
                                <input type="date" id="alis_tarihi">
                            </div>
                        </div>
                    </div>

                    <div class="image-section">
                        <label>Ürün Fotoğrafı</label>
                        <input type="file" id="stok_gorseli" accept="image/jpeg,image/png,image/webp,image/gif" class="file-input">
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button onclick="closeStockModal()" class="btn-cancel">İptal</button>
                <button onclick="addStok()" class="btn-save">Kaydet</button>
            </div>
        </div>
    </div>

    <div id="editStockModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ Stok Düzenle</h3>
                <span class="close-btn" onclick="closeEditStockModal()">&times;</span>
            </div>
            
            <div class="modal-body">
                <form id="editStockForm">
                    <input type="hidden" id="edit_stok_id">
                    <input type="hidden" id="edit_gorsel_sil" value="0">
                    
                    <div class="form-group">
                        <label>Ürün Kodu</label>
                        <input type="text" id="edit_urun_kodu" required>
                    </div>
                    <div class="form-group">
                        <label>Ürün İsmi</label>
                        <input type="text" id="edit_urun_ismi" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label>Kaç Top?</label>
                            <input type="number" id="edit_top_sayisi">
                        </div>
                        <div class="form-group half">
                            <label>Kaç Metre?</label>
                            <input type="number" id="edit_metre" step="0.01">
                        </div>
                    </div>
                    
                    <div class="payment-section">
                        <label class="section-title">Maliyet Bilgileri</label>
                        <div class="form-row">
                            <div class="form-group half">
                                <label>Alış Fiyatı (TL)</label>
                                <input type="number" id="edit_alis_fiyati" step="0.01">
                            </div>
                            <div class="form-group half">
                                <label>Alış Tarihi</label>
                                <input type="date" id="edit_alis_tarihi">
                            </div>
                        </div>
                    </div>

                    <div class="image-section">
                        <label>Görseli Değiştir</label>
                        <div id="editStokImagePreview" style="margin-bottom:10px;"></div>
                        <input type="file" id="edit_stok_gorseli" accept="image/jpeg,image/png,image/webp,image/gif" class="file-input">
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button onclick="closeEditStockModal()" class="btn-cancel">İptal</button>
                <button onclick="updateStok()" class="btn-save">Değişiklikleri Kaydet</button>
            </div>
        </div>
    </div>

    <div id="imageModal" class="modal full-screen" onclick="closeImageModal()">
        <span class="close-btn-fullscreen">&times;</span>
        <div class="modal-content" style="background:transparent; box-shadow:none; border:none; align-items: center; justify-content: center;">
            <img id="imgViewer" style="max-width:90vw; max-height:90vh; border-radius:8px; object-fit: contain;">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
