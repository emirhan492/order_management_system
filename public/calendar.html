<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Takvim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>📅 Takvim & Ajanda</h2>
            <a href="/" class="btn-geri">🏠 Ana Menü</a>
        </div>

        <div class="calendar-header">
            <button onclick="changeMonth(-1)">❮ Önceki</button>
            <h3 id="currentMonthYear">Ocak 2024</h3>
            <button onclick="changeMonth(1)">Sonraki ❯</button>
        </div>

        <div class="calendar-grid">
            <div class="day-name">Pzt</div>
            <div class="day-name">Sal</div>
            <div class="day-name">Çar</div>
            <div class="day-name">Per</div>
            <div class="day-name">Cum</div>
            <div class="day-name">Cmt</div>
            <div class="day-name">Paz</div>
            </div>
        
        <p style="text-align: center; color: #666; font-size: 14px; margin-top: 10px;">
            💡 Bir güne hatırlatıcı eklemek için kutucuğa tıklayın.
        </p>

    </div>
    <div id="dayModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalDateTitle">23 Ocak 2024</h3>
            
            <div id="modalBody" class="modal-body">
                </div>

            <div class="modal-footer">
                <input type="text" id="modalNoteInput" placeholder="Yeni hatırlatıcı yaz..." />
                <button onclick="saveModalNote()" class="btn-modal-ekle">Ekle</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
