<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Takvim ve Ajanda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>📅 Takvim & Ajanda</h2>
            <a href="/" class="btn-geri">🏠 Ana Menü</a>
        </div>

        <div class="card">
            <div class="calendar-controls">
                <button onclick="changeMonth(-1)" class="btn-geri">◀ Önceki</button>
                <h3 id="currentMonthYear" style="margin:0; color:#2c3e50;">Ocak 2026</h3>
                <button onclick="changeMonth(1)" class="btn-geri">Sonraki ▶</button>
            </div>

            <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 10px; text-align: center; font-weight: bold; color: #7f8c8d;">
                <div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div>
            </div>

            <div class="calendar-grid">
                </div>
        </div>
    </div>

    <div id="dayModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalDateTitle">Tarih</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            
            <div class="modal-body" id="modalBody">
                </div>

            <div class="modal-footer" style="display:flex; gap:10px;">
                <input type="text" id="modalNoteInput" placeholder="Bugüne not ekle..." style="flex:1;">
                <button onclick="saveModalNote()" style="background:#3498db; color:white; border:none; padding:8px 15px; border-radius:4px;">Ekle</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
