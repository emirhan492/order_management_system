<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Takvim ve Ajanda</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Takvime özel ufak stiller */
        .calendar-controls { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 15px; padding: 15px; background: #f8fafc; border-bottom: 1px solid var(--border);
        }
        .calendar-controls h3 { font-size: 1.25rem; color: var(--text-main); font-weight: 700; margin: 0; }
        
        .weekday-header {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; 
            margin-bottom: 10px; text-align: center; padding: 0 5px;
        }
        .weekday-header div {
            font-weight: 600; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase;
        }
        
        /* Mobilde gün isimlerini gizle (Liste görünümüne geçtiği için) */
        @media (max-width: 768px) {
            .weekday-header { display: none; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h2>📅 Takvim & Ajanda</h2>
            <a href="/" class="btn-secondary">🏠 Ana Menü</a>
        </div>

        <div class="card">
            <div class="calendar-controls">
                <button onclick="changeMonth(-1)" class="btn-secondary">◀ Önceki</button>
                <h3 id="currentMonthYear">Ocak 2026</h3>
                <button onclick="changeMonth(1)" class="btn-secondary">Sonraki ▶</button>
            </div>

            <div class="weekday-header">
                <div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div>
            </div>

            <div class="calendar-grid"></div>
        </div>
    </div>

    <div id="dayModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalDateTitle">Tarih</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            
            <div class="modal-body" id="modalBody" style="min-height: 100px;">
                </div>

            <div class="modal-footer">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <input type="text" id="modalNoteInput" placeholder="📌 Bu güne özel not ekle..." style="flex: 1;">
                    <button onclick="saveModalNote()" class="btn-save">Ekle</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
