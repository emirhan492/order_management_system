<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Fiyat Hesapla</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Sadece bu sayfaya özel yerleşim ayarları */
        .calc-wrapper { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
        .calc-left { flex: 1; min-width: 300px; }
        .calc-right { flex: 1; min-width: 300px; }
        
        .order-list { list-style: none; padding: 0; margin: 0; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); max-height: 400px; overflow-y: auto; }
        .order-item { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .order-item:last-child { border-bottom: none; }
        
        .total-box { background: var(--total-bg); color: white; padding: 20px; border-radius: 12px; margin-top: 15px; text-align: center; box-shadow: var(--shadow); }
        .result-box { text-align: center; margin-top: 15px; padding: 15px; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-header">
            <h2>🧮 Toplu Sipariş Hesaplayıcı</h2>
            <a href="/" class="btn-secondary">🏠 Ana Menü</a>
        </div>

        <div class="calc-wrapper">
            
            <div class="calc-left">
                <div class="card">
                    <div class="form-group">
                        <label>Ürün Türü</label>
                        <select id="calcKategori" onchange="yapHesap()">
                            <option value="Zebra">Zebra Perde</option>
                            <option value="Stor">Stor Perde</option>
                            <option value="Tül">Tül Perde</option>
                            <option value="Güneşlik">Güneşlik</option>
                            <option value="Plicell">Plicell</option>
                            <option value="Nevresim">Nevresim</option>
                            <option value="Yastık">Yastık</option>
                            <option value="Çarşaf">Çarşaf</option>
                        </select>
                    </div>

                    <div id="pileSecenekleri" style="display: none; margin-bottom: 15px;" class="image-section">
                        <label style="color:var(--primary); font-weight:bold;">Tül Pile Sıklığı</label>
                        <div class="radio-group">
                            <label class="radio-label"><input type="radio" name="pileOrani" value="3" onchange="yapHesap()" checked> <span>Sık (x3)</span></label>
                            <label class="radio-label"><input type="radio" name="pileOrani" value="2.5" onchange="yapHesap()"> <span>Orta (x2.5)</span></label>
                            <label class="radio-label"><input type="radio" name="pileOrani" value="2" onchange="yapHesap()"> <span>Seyrek (x2)</span></label>
                        </div>
                    </div>

                    <div id="storSecenekleri" style="display: none; margin-bottom: 15px;" class="image-section">
                        <label style="color:var(--amber-text); font-weight:bold;">Ekstralar</label>
                        <div class="radio-group">
                            <label class="radio-label"><input type="checkbox" id="optEtek" onchange="yapHesap()"> <span>Etek (+100)</span></label>
                            <label class="radio-label"><input type="checkbox" id="optBoncuk" onchange="yapHesap()"> <span>Boncuk (+200)</span></label>
                            <label class="radio-label"><input type="checkbox" id="optLazer" onchange="yapHesap()"> <span>Lazer (+400)</span></label>
                            <label class="radio-label"><input type="checkbox" id="optCita" onchange="yapHesap()"> <span>Çıta (+1300)</span></label>
                        </div>
                    </div>

                    <div id="carsafSecenekleri" style="display: none; margin-bottom: 15px;" class="image-section">
                        <label style="color:var(--sky-text); font-weight:bold;">Çarşaf Tipi</label>
                        <div class="radio-group">
                            <label class="radio-label"><input type="radio" name="carsafTip" value="cift" onchange="yapHesap()" checked> <span>Çift (2.5m)</span></label>
                            <label class="radio-label"><input type="radio" name="carsafTip" value="tek" onchange="yapHesap()"> <span>Tek (1.8m)</span></label>
                            <label class="radio-label"><input type="radio" name="carsafTip" value="lastik" onchange="yapHesap()"> <span>Lastik (2.85m)</span></label>
                            <label class="radio-label"><input type="radio" name="carsafTip" value="diger" onchange="yapHesap()"> <span>Diğer</span></label>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label>En (cm)</label>
                            <input type="number" id="calcEn" placeholder="200" oninput="yapHesap()">
                        </div>
                        <div class="form-group half">
                            <label>Boy (cm)</label>
                            <input type="number" id="calcBoy" placeholder="250" oninput="yapHesap()">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Birim Fiyat (TL)</label>
                        <input type="number" id="calcBirimFiyat" placeholder="450" oninput="yapHesap()">
                    </div>

                    <div class="result-box">
                        <span id="sonucM2" style="font-weight:bold; color:var(--text-secondary); font-size:1.1rem;">0 m²</span>
                        <div style="font-size:1.5rem; font-weight:bold; color:var(--primary); margin:5px 0;" id="sonucFiyat">0 TL</div>
                        <div id="hesapAciklama" style="font-size:0.85rem; color:var(--amber-text);"></div>
                    </div>

                    <button onclick="listeyeEkle()" class="btn-save" style="width: 100%; margin-top: 15px; padding: 12px; font-size: 1rem; background:#f59e0b;">
                        ➕ Listeye Ekle
                    </button>
                </div>
            </div>

            <div class="calc-right">
                <div class="card">
                    <h3 style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); font-size: 1.1rem;">🛒 Oluşturulan Liste</h3>
                    
                    <ul id="siparisListesi" class="order-list">
                        <li style="padding: 30px; text-align: center; color: var(--text-muted);">Henüz ürün eklenmedi.</li>
                    </ul>

                    <div class="total-box">
                        <small style="opacity: 0.8; font-size: 0.85rem;">GENEL TOPLAM</small><br>
                        <strong id="genelToplam" style="font-size: 2rem;">0 TL</strong>
                    </div>

                    <button onclick="topluSipariseGec()" class="btn-save" style="width: 100%; margin-top: 15px; padding: 15px; font-size: 1.1rem;">
                        ✅ Siparişi Oluştur
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
